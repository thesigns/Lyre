<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#E9DFC9">
  <title>Lyre</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <main id="stage">
    <canvas id="strings"></canvas>
  </main>

  <button id="menu-button" type="button" aria-label="Menu">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>

  <div id="melody-bar" hidden>
    <span id="melody-title"></span>
    <button id="melody-restart" type="button">Restart</button>
    <button id="melody-listen" type="button">Listen</button>
    <button id="melody-exit" type="button" aria-label="Exit melody">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <p id="hint" hidden>Widen the window or rotate your device to play.</p>
  <pre id="debug"></pre>

  <section id="menu">
    <h1>Lyre</h1>
    <div class="menu-buttons">
      <button id="play" type="button">Play</button>
      <button id="open-melodies" type="button">Melodies</button>
      <button id="open-settings" type="button">Settings</button>
    </div>
  </section>

  <section id="melodies" class="panel" hidden>
    <header>
      <h2>Melodies</h2>
      <button id="close-melodies" type="button">Back</button>
    </header>
    <ul id="melody-list"></ul>
  </section>

  <section id="settings" class="panel" hidden>
    <header>
      <h2>Settings</h2>
      <button id="close-settings" type="button">Done</button>
    </header>
    <form id="settings-form">
      <p id="tuning-locked" hidden>Tuning is set by the current melody.</p>
      <label class="row">
        <span>Tetrachord</span>
        <select name="genus"></select>
      </label>
      <label class="row">
        <span>Scale</span>
        <select name="scale"></select>
      </label>
      <label class="row">
        <span>Lowest string</span>
        <select name="lowestNote"></select>
      </label>
      <label class="row">
        <span>Left-handed</span>
        <input type="checkbox" name="leftHanded">
      </label>
      <label class="row">
        <span>Volume</span>
        <input type="range" name="volume" min="0" max="1" step="0.01">
      </label>
      <label class="row">
        <span>Show latency info</span>
        <input type="checkbox" name="showLatency">
      </label>
    </form>
  </section>
</body>
</html>
